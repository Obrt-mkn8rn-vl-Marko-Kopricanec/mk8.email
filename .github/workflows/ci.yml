name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore mk8.email.slnx --locked-mode

      - name: Build
        run: dotnet build mk8.email.slnx --configuration Release --no-restore --property:TreatWarningsAsErrors=true --property:ContinuousIntegrationBuild=true

      - name: Validate operations code
        run: |
          shellcheck \
            deploy/scripts/activate-distributed-role \
            deploy/scripts/activate-mail-stack \
            deploy/scripts/configure-apt-sources \
            deploy/scripts/configure-mail-database-access \
            deploy/scripts/deactivate-distributed-role \
            deploy/scripts/deactivate-mail-stack \
            deploy/scripts/deploy-admin-certificate \
            deploy/scripts/deploy-mk8-domain-certificate \
            deploy/scripts/deploy-mk8-certificate \
            deploy/scripts/initialize-postgresql \
            deploy/scripts/install-build-environment \
            deploy/scripts/install-host-hardening \
            deploy/scripts/install-distributed-role \
            deploy/scripts/install-mail-stack \
            deploy/scripts/install-native-release \
            deploy/scripts/mk8-build \
            deploy/scripts/mk8-domain \
            deploy/scripts/mk8email \
            deploy/scripts/mk8-backup \
            deploy/scripts/mk8-export-backup \
            deploy/scripts/mk8-mail-health \
            deploy/scripts/prune-native-releases \
            deploy/scripts/verify-host-prerequisites \
            deploy/tests/aide_alert_smoke \
            deploy/tests/apt_sources_smoke \
            deploy/tests/backup_restore_smoke \
            deploy/tests/build_environment_smoke \
            deploy/tests/certificate_deploy_smoke \
            deploy/tests/disruption_smoke \
            deploy/tests/host_hardening_smoke \
            deploy/tests/management_cli_smoke \
            deploy/tests/multi_domain_smoke \
            deploy/tests/native_release_smoke \
            deploy/tests/prerequisites_smoke \
            deploy/tests/release_retention_smoke \
            deploy/tests/tls_smoke
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/mk8email-pycache" \
            python3 -m py_compile deploy/tests/dashboard_smoke.py deploy/tests/distributed_config_smoke.py deploy/tests/mail_smoke.py deploy/tests/multi_domain_smoke.py
          python3 deploy/tests/distributed_config_smoke.py

      - name: Validate deployment profile tooling
        shell: pwsh
        run: |
          $files = @(
            'deploy/scripts/deploy-production.ps1'
            'deploy/scripts/pull-encrypted-backup.ps1'
            'tools/deployment/Mk8DeploymentProfile.psm1'
            'tools/deployment/Test-Mk8DeploymentProfile.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | Format-Table -AutoSize
              throw "PowerShell parsing failed for $file."
            }
          }
          ./tools/deployment/Test-Mk8DeploymentProfile.ps1 `
            -TaskRoot (Join-Path $env:RUNNER_TEMP 'mk8email-deployment-profile')

      - name: Test application
        run: dotnet test mk8.email.Application.Tests/mk8.email.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=application.trx" --results-directory artifacts/test-results

      - name: Test infrastructure
        run: dotnet test mk8.email.Infrastructure.Tests/mk8.email.Infrastructure.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=infrastructure.trx" --results-directory artifacts/test-results

      - name: Publish management command
        run: dotnet publish mk8.email.CLI/mk8.email.Application.CLI.csproj --configuration Release --no-build --output artifacts/cli --property:UseAppHost=false

      - name: Publish administrator dashboard
        run: dotnet publish mk8.email.Gateway/mk8.email.Gateway.csproj --configuration Release --no-build --output artifacts/admin --property:UseAppHost=false

      - name: Publish Application Worker
        run: dotnet publish mk8.email.Application.Worker/mk8.email.Application.Worker.csproj --configuration Release --no-build --output artifacts/worker --property:UseAppHost=false

      - name: Package release
        run: |
          tar --create --gzip --file=artifacts/mk8email-linux-x64.tar.gz --directory=artifacts cli admin worker
          sha256sum artifacts/mk8email-linux-x64.tar.gz > artifacts/mk8email-linux-x64.tar.gz.sha256

      - name: Save evidence and release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mk8email-${{ github.sha }}
          path: |
            artifacts/mk8email-linux-x64.tar.gz
            artifacts/mk8email-linux-x64.tar.gz.sha256
            artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14

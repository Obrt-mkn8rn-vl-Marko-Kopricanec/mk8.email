name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mk8email-ci-only
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore mk8.email.slnx --locked-mode

      - name: Build all projects
        # Application Core's newly enabled analyzer migration is not yet clean.
        # Keep compiler warnings fatal while its analyzer diagnostics are resolved.
        run: dotnet build mk8.email.slnx --configuration Release --no-restore --property:TreatWarningsAsErrors=true --property:ContinuousIntegrationBuild=true --property:RunAnalyzers=false

      - name: Enforce completed analyzer gates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(grep -l '<EnforceCodeStyleInBuild>true' mk8.email.*/*.csproj | sort)
          for project in "${projects[@]}"; do
            # Remove this exception when the Application Core analyzer migration reaches zero diagnostics.
            if [[ "$project" == mk8.email.Application/mk8.email.Application.Core.csproj ]]; then
              continue
            fi
            dotnet build "$project" --configuration Release --no-restore --no-dependencies \
              --property:TreatWarningsAsErrors=true \
              --property:ContinuousIntegrationBuild=true \
              --property:RunAnalyzers=true
          done

      - name: Build Gateway and Worker container targets
        run: |
          docker build --quiet --target gateway --tag mk8email-gateway-ci:${{ github.sha }} .
          docker build --quiet --target worker --tag mk8email-worker-ci:${{ github.sha }} .

      - name: Install backup archive test tool
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Validate operations code
        run: |
          shellcheck \
            deploy/scripts/activate-distributed-role \
            deploy/scripts/activate-mail-stack \
            deploy/scripts/configure-apt-sources \
            deploy/scripts/configure-gateway-database-access \
            deploy/scripts/configure-wake-database-access \
            deploy/scripts/container-worker-entrypoint \
            deploy/scripts/configure-mail-database-access \
            deploy/scripts/deactivate-distributed-role \
            deploy/scripts/ensure-wake-service-account \
            deploy/scripts/deactivate-mail-stack \
            deploy/scripts/deploy-admin-certificate \
            deploy/scripts/deploy-mk8-domain-certificate \
            deploy/scripts/deploy-mk8-certificate \
            deploy/scripts/initialize-postgresql \
            deploy/scripts/install-build-environment \
            deploy/scripts/install-host-hardening \
            deploy/scripts/install-distributed-role \
            deploy/scripts/upgrade-distributed-role \
            deploy/scripts/install-mail-stack \
            deploy/scripts/install-native-release \
            deploy/scripts/mk8-build \
            deploy/scripts/mk8-domain \
            deploy/scripts/mk8email \
            deploy/scripts/mk8-backup \
            deploy/scripts/mk8-distributed-backup \
            deploy/scripts/mk8-distributed-archive \
            deploy/scripts/mk8-distributed-offsite-backup \
            deploy/scripts/mk8-export-backup \
            deploy/scripts/mk8-mail-health \
            deploy/scripts/prune-native-releases \
            deploy/scripts/verify-host-prerequisites \
            deploy/tests/aide_alert_smoke \
            deploy/tests/apt_sources_smoke \
            deploy/tests/backup_restore_smoke \
            deploy/tests/build_environment_smoke \
            deploy/tests/certificate_deploy_smoke \
            deploy/tests/container_on_demand_smoke \
            deploy/tests/disruption_smoke \
            deploy/tests/distributed_backup_job_smoke \
            deploy/tests/distributed_archive_smoke \
            deploy/tests/distributed_offsite_backup_smoke \
            deploy/tests/fixtures/distributed-backup-dotnet \
            deploy/tests/fixtures/upgrade-curl \
            deploy/tests/fixtures/upgrade-runuser \
            deploy/tests/fixtures/upgrade-systemctl \
            deploy/tests/fixtures/on-demand-id \
            deploy/tests/fixtures/on-demand-runuser \
            deploy/tests/fixtures/on-demand-systemctl \
            deploy/tests/fixtures/container-dotnet \
            deploy/tests/host_hardening_smoke \
            deploy/tests/management_cli_smoke \
            deploy/tests/multi_domain_smoke \
            deploy/tests/native_release_smoke \
            deploy/tests/on_demand_activation_smoke \
            deploy/tests/prerequisites_smoke \
            deploy/tests/release_retention_smoke \
            deploy/tests/systemd_path_retrigger_smoke \
            deploy/tests/tls_smoke \
            deploy/tests/upgrade_distributed_role_smoke \
            deploy/tests/wake_database_access_smoke
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/mk8email-pycache" \
            python3 -m py_compile \
              deploy/scripts/extract-distributed-snapshot-tar.py \
              deploy/tests/dashboard_smoke.py deploy/tests/distributed_config_smoke.py \
              deploy/tests/mail_smoke.py deploy/tests/multi_domain_smoke.py
          python3 deploy/tests/distributed_config_smoke.py
          sh deploy/tests/container_on_demand_smoke \
            "$PWD/deploy/scripts/container-worker-entrypoint" \
            "$PWD/deploy/tests/fixtures/container-dotnet" \
            "$PWD/Dockerfile"
          sh deploy/tests/upgrade_distributed_role_smoke "$PWD/deploy/scripts/upgrade-distributed-role"
          sh deploy/tests/on_demand_activation_smoke "$PWD/deploy/scripts/activate-distributed-role" "$PWD/deploy/scripts/deactivate-distributed-role"
          sh deploy/tests/distributed_backup_job_smoke "$PWD/deploy/scripts/mk8-distributed-backup" "$PWD/deploy/tests/fixtures/distributed-backup-dotnet"
          bash deploy/tests/distributed_archive_smoke "$PWD/deploy/scripts/mk8-distributed-archive" "$PWD/deploy/tests/fixtures/distributed-backup-dotnet"
          sh deploy/tests/distributed_offsite_backup_smoke "$PWD/deploy/scripts/mk8-distributed-offsite-backup" "$PWD/deploy/scripts/mk8-distributed-archive" "$PWD/deploy/tests/fixtures/distributed-backup-dotnet"
          systemd-analyze verify deploy/systemd/mk8email-wake.service deploy/systemd/mk8email-worker.path deploy/systemd/mk8email-worker-drain.service deploy/systemd/mk8email-worker-maintenance.timer deploy/systemd/mk8email-offsite-backup.service deploy/systemd/mk8email-offsite-backup.timer

      - name: Validate deployment profile tooling
        shell: pwsh
        run: |
          $files = @(
            'deploy/scripts/deploy-production.ps1'
            'deploy/scripts/pull-encrypted-backup.ps1'
            'tools/deployment/Mk8DeploymentProfile.psm1'
            'tools/deployment/Test-Mk8DeploymentProfile.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | Format-Table -AutoSize
              throw "PowerShell parsing failed for $file."
            }
          }
          ./tools/deployment/Test-Mk8DeploymentProfile.ps1 `
            -TaskRoot (Join-Path $env:RUNNER_TEMP 'mk8email-deployment-profile')

      - name: Test application
        run: dotnet test mk8.email.Application.Tests/mk8.email.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=application.trx" --results-directory artifacts/test-results

      - name: Test infrastructure
        env:
          MK8_EMAIL_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=postgres;Username=postgres;Password=mk8email-ci-only;Pooling=false
        run: dotnet test mk8.email.Infrastructure.Tests/mk8.email.Infrastructure.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=infrastructure.trx" --results-directory artifacts/test-results

      - name: Test distributed messaging with PostgreSQL and Azure Blob
        shell: bash
        env:
          MK8_EMAIL_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=postgres;Username=postgres;Password=mk8email-ci-only;Pooling=false
          MK8_EMAIL_TEST_AZURE_BLOB_CONNECTION: UseDevelopmentStorage=true
        run: |
          set -euo pipefail
          azurite_container="mk8email-azurite-${{ github.run_id }}"
          docker run --detach --rm --name "$azurite_container" \
            --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --inMemoryPersistence --disableTelemetry \
            --silent --skipApiVersionCheck --blobHost 0.0.0.0 --blobPort 10000
          trap 'docker stop "$azurite_container" >/dev/null || true' EXIT
          azurite_ready=false
          for _ in {1..30}; do
            if curl --silent --max-time 1 --output /dev/null \
              http://127.0.0.1:10000/devstoreaccount1; then
              azurite_ready=true
              break
            fi
            sleep 1
          done
          test "$azurite_ready" = true
          dotnet test mk8.email.Messaging.Tests/mk8.email.Messaging.Tests.csproj \
            --configuration Release --no-build \
            --logger "trx;LogFileName=messaging.trx" \
            --results-directory artifacts/test-results

      - name: Require all test cases to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          results = Path('artifacts/test-results')
          for name in ('application.trx', 'infrastructure.trx', 'messaging.trx'):
              report = results / name
              counters = ElementTree.parse(report).find('.//{*}Counters')
              if counters is None or counters.get('total') != counters.get('passed'):
                  raise SystemExit(f'Tests failed or did not execute: {report}')
          PY

      - name: Publish management command
        run: dotnet publish mk8.email.CLI/mk8.email.Application.CLI.csproj --configuration Release --no-build --output artifacts/cli --property:UseAppHost=false

      - name: Publish administrator dashboard
        run: dotnet publish mk8.email.Gateway/mk8.email.Gateway.csproj --configuration Release --no-build --output artifacts/admin --property:UseAppHost=false

      - name: Publish Application Worker
        run: dotnet publish mk8.email.Application.Worker/mk8.email.Application.Worker.csproj --configuration Release --no-build --output artifacts/worker --property:UseAppHost=false

      - name: Package release
        run: |
          tar --create --gzip --file=artifacts/mk8email-linux-x64.tar.gz --directory=artifacts cli admin worker
          sha256sum artifacts/mk8email-linux-x64.tar.gz > artifacts/mk8email-linux-x64.tar.gz.sha256

      - name: Save evidence and release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mk8email-${{ github.sha }}
          path: |
            artifacts/mk8email-linux-x64.tar.gz
            artifacts/mk8email-linux-x64.tar.gz.sha256
            artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14

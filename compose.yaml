name: mk8-email-control-plane

services:
  gateway:
    image: mk8.email-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_ENVIRONMENT: Production
      MK8EMAIL_CONFIG_FILE: /run/secrets/gateway_config
    secrets:
      - gateway_config
      - gateway_database_password
      - messaging_encryption_key
      - object_storage_connection
      - tls_certificate
      - tls_private_key
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - admin-state:/var/lib/mk8email-admin
      - admin-logs:/var/log/mk8email-admin
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 30s
    networks:
      - backend
      - edge
    logging:
      options:
        max-size: 10m
        max-file: "3"

  worker:
    image: mk8.email-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: Production
      MK8EMAIL_CONFIG_FILE: /run/secrets/worker_config
    secrets:
      - worker_config
      - wake_database_connection
      - database_password
      - messaging_encryption_key
      - object_storage_connection
      - oidc_signing_key
      - mfa_encryption_key
      - dkim_private_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 60s
    networks:
      - backend
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  gateway_config:
    file: ./deploy/secrets/gateway_config.json
  worker_config:
    file: ./deploy/secrets/worker_config.json
  wake_database_connection:
    file: ./deploy/secrets/wake_database_connection
  database_password:
    file: ./deploy/secrets/database_password
  gateway_database_password:
    file: ./deploy/secrets/gateway_database_password
  messaging_encryption_key:
    file: ./deploy/secrets/messaging_encryption_key
  object_storage_connection:
    file: ./deploy/secrets/object_storage_connection
  oidc_signing_key:
    file: ./deploy/secrets/oidc_signing_key.pem
  mfa_encryption_key:
    file: ./deploy/secrets/mfa_encryption_key
  tls_certificate:
    file: ./deploy/secrets/tls_certificate.pem
  tls_private_key:
    file: ./deploy/secrets/tls_private_key.pem
  dkim_private_key:
    file: ./deploy/secrets/dkim_private_key.pem

volumes:
  admin-state:
  admin-logs:

networks:
  backend: {}
  edge:
    ipam:
      config:
        - subnet: 172.30.8.0/24

server {
    listen @@MK8_SERVER_IPV4@@:8443 ssl;
    http2 on;
    server_name @@MK8_ADMIN_HOST@@ @@MK8_SERVER_IPV4@@;
    access_log /var/log/nginx/admin-access.log mk8_safe;
    error_log /var/log/nginx/admin-error.log warn;

    allow 127.0.0.0/8;
    allow @@MK8_LAN_CIDR@@;
    deny all;

    ssl_certificate /etc/mk8email/admin-tls/fullchain.pem;
    ssl_certificate_key /etc/mk8email/admin-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 64k;

    location = /Login {
        limit_req zone=admin_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
